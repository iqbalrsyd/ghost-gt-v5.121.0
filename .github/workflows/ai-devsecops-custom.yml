name: "AI DevSecOps \u2014 Domain Compliance (general)"
'on':
  workflow_call:
    inputs:
      detected_domain:
        description: Domain classification from the AI agent.
        required: false
        type: string
        default: general
permissions:
  contents: read
  security-events: write
jobs:
  auth-jwt-secret-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        persist-credentials: false
    - name: scan-jwt-secret-sources
      run: "# Set up output capture for the annotation-to-SARIF step.\nexec > >(tee\
        \ -a security.shell_log) 2>&1\n# Run the original script in a subshell with\
        \ set +e so\n# that any single command failure does not abort the\n# script\
        \ before it can emit a '::error' annotation.\ninner_exit=0\n( set +e\ncd \"\
        $GITHUB_WORKSPACE\"\nfound=0\necho '::group::Scanning for weak JWT signing\
        \ secrets in apps/'\n# 1) Detect short or default-looking JWT_SECRET in env\
        \ files and source\nif grep -rEn \"JWT_SECRET[[:space:]]*[:=][[:space:]]*['\\\
        \"]?[A-Za-z0-9_-]{0,31}['\\\"]?\" apps/ --include='*.js' --include='*.ts'\
        \ --include='.env*' 2>/dev/null; then\n  echo '::error title=Weak JWT secret::Short\
        \ or placeholder JWT_SECRET detected (must be >=32 chars of high entropy)'\n\
        \  found=1\nfi\n# 2) Detect default secret strings (secret/secret, changeme,\
        \ default) in auth-related code\nif grep -rEni \"['\\\"](secret|changeme|default|admin|test)['\\\
        \"]\" apps/ --include='*.js' --include='*.ts' 2>/dev/null | grep -Ei \"(jwt|token|secret|sign)\"\
        \ ; then\n  echo '::error title=Default JWT secret::Default string used as\
        \ JWT secret'\n  found=1\nfi\n# 3) Detect jwt.sign usage missing algorithms\
        \ option (algorithm confusion risk)\nif grep -rEn \"jwt\\.sign\\s*\\(\" apps/\
        \ --include='*.js' --include='*.ts' 2>/dev/null | grep -v \"algorithms\" ;\
        \ then\n  echo '::warning title=JWT verify missing algorithms::jwt.verify()\
        \ calls should pin algorithms to prevent alg:none/RS256->HS256 confusion'\n\
        \  found=1\nfi\necho '::endgroup::\nexit $found\n) || inner_exit=$?\n# If\
        \ the inner script exited non-zero and emitted no\n# '::error'/'::warning'\
        \ annotation, synthesise one so the\n# SARIF conversion step still has a finding\
        \ to record.\nif [ \"$inner_exit\" -ne 0 ] && ! grep -qE '^::(error|warning)'\
        \ security.shell_log; then\n  echo \"::error file=scan-jwt-secret-sources::shell\
        \ check failed (exit code $inner_exit) \u2014 see run log for details\"\n\
        fi\nexit $inner_exit\n"
    - name: detect-jwt-verify-without-algorithms
      run: "echo 'AI-designed Semgrep rule (id=ai-rule):'\necho 'Rule body:'\ncat\
        \ <<'SEMGREP_EOF' | sed 's/^/  /'\nrules:\n  - id: jwt-verify-missing-algorithms\n\
        \    languages: [javascript, typescript]\n    severity: ERROR\n    message:\
        \ >-\n      jwt.verify() called without an `algorithms` allow-list. Attackers\
        \ can\n      exploit alg=none or HS256/RS256 confusion to forge tokens. Pin\
        \ the\n      expected algorithm explicitly (e.g. algorithms: ['HS256']).\n\
        \    metadata:\n      category: security\n      cwe: \"CWE-347: Improper Verification\
        \ of Cryptographic Signature\"\n      owasp: \"A02:2021 - Cryptographic Failures\"\
        \n    pattern: jwt.verify($TOKEN, $SECRET, $OPTS)\n    pattern-not: jwt.verify($TOKEN,\
        \ $SECRET, {...algorithms: [...]})\n    pattern-not-inside: |\n      $OPTS\
        \ = {...algorithms: [...]}\n      ...\n      jwt.verify($TOKEN, $SECRET, $OPTS)\n\
        \  - id: jwt-sign-with-short-secret\n    languages: [javascript, typescript]\n\
        \    severity: WARNING\n    message: >-\n      jwt.sign() secret appears to\
        \ be a hardcoded short string literal. Use\n      process.env.JWT_SECRET with\
        \ a >=32-byte high-entropy value loaded from\n      a secrets manager.\n \
        \   metadata:\n      category: security\n      cwe: \"CWE-798: Use of Hard-coded\
        \ Credentials\"\n    pattern-either:\n      - pattern: jwt.sign($P, \"$S\"\
        , $O)\n      - pattern: jwt.verify($T, \"$S\", $O)\n    metavariable-regex:\n\
        \      metavariable: $S\n      regex: \"^.{0,31}$\"\nSEMGREP_EOF\n"
    - name: Convert security shell_check annotations to SARIF
      if: always()
      run: "cat > security_annotations_to_sarif.py <<'PY_EOF'\nimport os, re, json\n\
        log_path = 'security.shell_log'\nsarif_path = 'security-results.sarif'\ntool_name\
        \ = 'security'\ntool_version = '1.0.0'\ninformation_uri = 'https://github.com/iqbalrsyd/ai-devsecops'\n\
        rule_id_prefix = 'ai-devsecops-security'\nresults = []\nif os.path.exists(log_path):\n\
        \    pat = re.compile(\n        r'^::(error|warning)(?:\\s+([A-Za-z]+=[^,]+(?:,[A-Za-z]+=[^,]+)*))?::(.*)$'\n\
        \    )\n    for idx, line in enumerate(open(log_path, encoding='utf-8', errors='replace')):\n\
        \        m = pat.match(line.rstrip('\\n'))\n        if not m:\n          \
        \  continue\n        level, props, msg = m.groups()\n        path = None\n\
        \        sl = None\n        el = None\n        title = None\n        if props:\n\
        \            for kv in props.split(','):\n                if '=' in kv:\n\
        \                    k, v = kv.split('=', 1)\n                    k = k.strip()\n\
        \                    v = v.strip()\n                    if k == 'file':\n\
        \                        path = v\n                    elif k == 'line':\n\
        \                        try:\n                            sl = int(v)\n \
        \                       except ValueError:\n                            pass\n\
        \                    elif k in ('endLine', 'col'):\n                     \
        \   try:\n                            el = int(v) if k == 'endLine' else sl\n\
        \                        except ValueError:\n                            pass\n\
        \                    elif k == 'title':\n                        title = v\n\
        \        if sl is None:\n            sl = 1\n        if el is None:\n    \
        \        el = sl\n        sarif_level = 'error' if level == 'error' else 'warning'\n\
        \        msg = (msg or '').strip()\n        # If there is no file but there\
        \ is a title, use the\n        if not msg and title:\n            msg = title\n\
        \        # Use the first 50 chars of the title (if any) as\n        slug_src\
        \ = title or msg or 'finding'\n        slug = re.sub(r'[^a-z0-9]+', '-', slug_src.lower())[:50].strip('-')\n\
        \        rule_id = f'{rule_id_prefix}-{slug}-{sl}-{idx}'\n        results.append({\n\
        \            'ruleId': rule_id,\n            'level': sarif_level,\n     \
        \       'message': {'text': msg or '(no message)'},\n            'locations':\
        \ [{\n                'physicalLocation': {\n                    'artifactLocation':\
        \ {'uri': path or 'unknown'},\n                    'region': {'startLine':\
        \ sl, 'endLine': el},\n                },\n            }],\n        })\nexisting\
        \ = {}\nif os.path.exists(sarif_path) and os.path.getsize(sarif_path) > 0:\n\
        \    try:\n        existing = json.load(open(sarif_path, encoding='utf-8'))\n\
        \    except Exception:\n        existing = {}\nif not existing or 'runs' not\
        \ in existing or not existing['runs']:\n    existing = {\n        'version':\
        \ '2.1.0',\n        '$schema': 'https://json.schemastore.org/sarif-2.1.0.json',\n\
        \        'runs': [{\n            'tool': {'driver': {\n                'name':\
        \ tool_name, 'version': tool_version, 'informationUri': information_uri,\n\
        \            }},\n            'results': [],\n        }],\n    }\nexisting['runs'][0]['tool']['driver']['name']\
        \ = tool_name\nexisting['runs'][0]['tool']['driver']['version'] = tool_version\n\
        existing['runs'][0]['tool']['driver']['informationUri'] = information_uri\n\
        existing['runs'][0]['results'] = (existing['runs'][0].get('results') or [])\
        \ + results\nwith open(sarif_path, 'w', encoding='utf-8') as f:\n    json.dump(existing,\
        \ f, indent=2)\nprint(f'Wrote {len(results)} SARIF result(s) to {sarif_path}')\n\
        PY_EOF\npython3 security_annotations_to_sarif.py\n"
    - name: Ensure security-results.sarif exists (fallback for 0 findings)
      if: always()
      run: "if [ ! -s security-results.sarif ]; then\n  echo \"::notice::security\
        \ found 0 findings. Generating empty SARIF to satisfy upload-sarif.\"\n  printf\
        \ '%s\\n' \\\n    '{' \\\n    '  \"version\": \"2.1.0\",' \\\n    '  \"$schema\"\
        : \"https://json.schemastore.org/sarif-2.1.0.json\",' \\\n    '  \"runs\"\
        : [' \\\n    '    {' \\\n    '      \"tool\": {' \\\n    '        \"driver\"\
        : {' \\\n    '          \"name\": \"security\",' \\\n    '          \"version\"\
        : \"0.65.0\",' \\\n    '          \"informationUri\": \"https://aquasecurity.github.io/trivy/\"\
        ' \\\n    '        }' \\\n    '      },' \\\n    '      \"results\": []' \\\
        \n    '    }' \\\n    '  ]' \\\n    '}' > security-results.sarif\nfi\necho\
        \ \"\u2713 security-results.sarif size: $(stat -c%s security-results.sarif)\
        \ bytes\"\n"
    - name: Upload security SARIF to GitHub Code Scanning
      if: always()
      uses: github/codeql-action/upload-sarif@b1722c1245f90604c2c348f9d1624af97ea8fc6e
      with:
        sarif_file: security-results.sarif
        category: security
  file-upload-mime-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        persist-credentials: false
    - name: scan-multer-configs-and-upload-routes
      run: "# Set up output capture for the annotation-to-SARIF step.\nexec > >(tee\
        \ -a security.shell_log) 2>&1\n# Run the original script in a subshell with\
        \ set +e so\n# that any single command failure does not abort the\n# script\
        \ before it can emit a '::error' annotation.\ninner_exit=0\n( set +e\ncd \"\
        $GITHUB_WORKSPACE\"\nfound=0\necho '::group::Scanning Express upload middleware\
        \ in apps/'\n# 1) Find multer() instantiations and flag those without a fileFilter\
        \ in the same statement/file\nfor f in $(grep -rEl \"multer\\s*\\(\" apps/\
        \ --include='*.js' --include='*.ts' 2>/dev/null); do\n  if ! grep -Eq \"fileFilter\"\
        \ \"$f\"; then\n    echo \"::error title=multer-missing-fileFilter::$f uses\
        \ multer() without a fileFilter, accepting any file type (CWE-434)\"\n   \
        \ found=1\n  fi\n  # 2) Flag multer.diskStorage with a destination under a\
        \ web-served path\n  if grep -Eq \"diskStorage|dest:\" \"$f\"; then\n    if\
        \ grep -Eq \"dest:.*(public|static|www|uploads)\" \"$f\"; then\n      echo\
        \ \"::error title=multer-diskStorage-public::$f writes uploads under a web-served\
        \ directory; uploaded scripts may be served and executed\"\n      found=1\n\
        \    fi\n  fi\ndone\n# 3) Detect upload route handlers that only check req.file.mimetype\
        \ (client-controlled)\nif grep -rEn \"req\\.file\\.mimetype\" apps/ --include='*.js'\
        \ --include='*.ts' 2>/dev/null \\\n   | grep -Ev \"fileFilter|file-type|fileTypeFromFile|magic-bytes\"\
        \ ; then\n  echo '::warning title=upload-mimetype-trust::Upload handler validates\
        \ only req.file.mimetype (client-controlled). Add server-side magic-byte check.'\n\
        \  found=1\nfi\necho '::endgroup::\nexit $found\n) || inner_exit=$?\n# If\
        \ the inner script exited non-zero and emitted no\n# '::error'/'::warning'\
        \ annotation, synthesise one so the\n# SARIF conversion step still has a finding\
        \ to record.\nif [ \"$inner_exit\" -ne 0 ] && ! grep -qE '^::(error|warning)'\
        \ security.shell_log; then\n  echo \"::error file=scan-multer-configs-and-upload-routes::shell\
        \ check failed (exit code $inner_exit) \u2014 see run log for details\"\n\
        fi\nexit $inner_exit\n"
    - name: detect-multer-without-filefilter
      run: "echo 'AI-designed Semgrep rule (id=ai-rule):'\necho 'Rule body:'\ncat\
        \ <<'SEMGREP_EOF' | sed 's/^/  /'\nrules:\n  - id: multer-missing-filefilter\n\
        \    languages: [javascript, typescript]\n    severity: ERROR\n    message:\
        \ >-\n      multer({...}) is instantiated without a fileFilter function. Without\n\
        \      it, any file type (including .html, .svg, .js, polyglot images) is\n\
        \      accepted, enabling stored XSS or RCE on web-served destinations.\n\
        \    metadata:\n      category: security\n      cwe: \"CWE-434: Unrestricted\
        \ Upload of File with Dangerous Type\"\n      owasp: \"A04:2021 - Insecure\
        \ Design\"\n    pattern: multer({...})\n    pattern-not: multer({..., fileFilter:\
        \ $F, ...})\n    pattern-not: multer({..., fileFilter: $F})\n  - id: upload-route-trusts-client-mimetype\n\
        \    languages: [javascript, typescript]\n    severity: WARNING\n    message:\
        \ >-\n      Upload route validates file type using req.file.mimetype, which\
        \ is\n      supplied by the HTTP client and trivially spoofable. Use a server-side\n\
        \      magic-byte library (file-type, magic-bytes.js) and an extension allow-list.\n\
        \    metadata:\n      category: security\n      cwe: \"CWE-434: Unrestricted\
        \ Upload of File with Dangerous Type\"\n    pattern-either:\n      - pattern:\
        \ |\n          if (req.file.mimetype !== $A) { ... }\n      - pattern: |\n\
        \          if (!/\\.png$|\\.jpg$/.test(req.file.originalname) && req.file.mimetype.startsWith($A))\
        \ { ... }\nSEMGREP_EOF\n"
    - name: Convert security shell_check annotations to SARIF
      if: always()
      run: "cat > security_annotations_to_sarif.py <<'PY_EOF'\nimport os, re, json\n\
        log_path = 'security.shell_log'\nsarif_path = 'security-results.sarif'\ntool_name\
        \ = 'security'\ntool_version = '1.0.0'\ninformation_uri = 'https://github.com/iqbalrsyd/ai-devsecops'\n\
        rule_id_prefix = 'ai-devsecops-security'\nresults = []\nif os.path.exists(log_path):\n\
        \    pat = re.compile(\n        r'^::(error|warning)(?:\\s+([A-Za-z]+=[^,]+(?:,[A-Za-z]+=[^,]+)*))?::(.*)$'\n\
        \    )\n    for idx, line in enumerate(open(log_path, encoding='utf-8', errors='replace')):\n\
        \        m = pat.match(line.rstrip('\\n'))\n        if not m:\n          \
        \  continue\n        level, props, msg = m.groups()\n        path = None\n\
        \        sl = None\n        el = None\n        title = None\n        if props:\n\
        \            for kv in props.split(','):\n                if '=' in kv:\n\
        \                    k, v = kv.split('=', 1)\n                    k = k.strip()\n\
        \                    v = v.strip()\n                    if k == 'file':\n\
        \                        path = v\n                    elif k == 'line':\n\
        \                        try:\n                            sl = int(v)\n \
        \                       except ValueError:\n                            pass\n\
        \                    elif k in ('endLine', 'col'):\n                     \
        \   try:\n                            el = int(v) if k == 'endLine' else sl\n\
        \                        except ValueError:\n                            pass\n\
        \                    elif k == 'title':\n                        title = v\n\
        \        if sl is None:\n            sl = 1\n        if el is None:\n    \
        \        el = sl\n        sarif_level = 'error' if level == 'error' else 'warning'\n\
        \        msg = (msg or '').strip()\n        # If there is no file but there\
        \ is a title, use the\n        if not msg and title:\n            msg = title\n\
        \        # Use the first 50 chars of the title (if any) as\n        slug_src\
        \ = title or msg or 'finding'\n        slug = re.sub(r'[^a-z0-9]+', '-', slug_src.lower())[:50].strip('-')\n\
        \        rule_id = f'{rule_id_prefix}-{slug}-{sl}-{idx}'\n        results.append({\n\
        \            'ruleId': rule_id,\n            'level': sarif_level,\n     \
        \       'message': {'text': msg or '(no message)'},\n            'locations':\
        \ [{\n                'physicalLocation': {\n                    'artifactLocation':\
        \ {'uri': path or 'unknown'},\n                    'region': {'startLine':\
        \ sl, 'endLine': el},\n                },\n            }],\n        })\nexisting\
        \ = {}\nif os.path.exists(sarif_path) and os.path.getsize(sarif_path) > 0:\n\
        \    try:\n        existing = json.load(open(sarif_path, encoding='utf-8'))\n\
        \    except Exception:\n        existing = {}\nif not existing or 'runs' not\
        \ in existing or not existing['runs']:\n    existing = {\n        'version':\
        \ '2.1.0',\n        '$schema': 'https://json.schemastore.org/sarif-2.1.0.json',\n\
        \        'runs': [{\n            'tool': {'driver': {\n                'name':\
        \ tool_name, 'version': tool_version, 'informationUri': information_uri,\n\
        \            }},\n            'results': [],\n        }],\n    }\nexisting['runs'][0]['tool']['driver']['name']\
        \ = tool_name\nexisting['runs'][0]['tool']['driver']['version'] = tool_version\n\
        existing['runs'][0]['tool']['driver']['informationUri'] = information_uri\n\
        existing['runs'][0]['results'] = (existing['runs'][0].get('results') or [])\
        \ + results\nwith open(sarif_path, 'w', encoding='utf-8') as f:\n    json.dump(existing,\
        \ f, indent=2)\nprint(f'Wrote {len(results)} SARIF result(s) to {sarif_path}')\n\
        PY_EOF\npython3 security_annotations_to_sarif.py\n"
    - name: Ensure security-results.sarif exists (fallback for 0 findings)
      if: always()
      run: "if [ ! -s security-results.sarif ]; then\n  echo \"::notice::security\
        \ found 0 findings. Generating empty SARIF to satisfy upload-sarif.\"\n  printf\
        \ '%s\\n' \\\n    '{' \\\n    '  \"version\": \"2.1.0\",' \\\n    '  \"$schema\"\
        : \"https://json.schemastore.org/sarif-2.1.0.json\",' \\\n    '  \"runs\"\
        : [' \\\n    '    {' \\\n    '      \"tool\": {' \\\n    '        \"driver\"\
        : {' \\\n    '          \"name\": \"security\",' \\\n    '          \"version\"\
        : \"0.65.0\",' \\\n    '          \"informationUri\": \"https://aquasecurity.github.io/trivy/\"\
        ' \\\n    '        }' \\\n    '      },' \\\n    '      \"results\": []' \\\
        \n    '    }' \\\n    '  ]' \\\n    '}' > security-results.sarif\nfi\necho\
        \ \"\u2713 security-results.sarif size: $(stat -c%s security-results.sarif)\
        \ bytes\"\n"
    - name: Upload security SARIF to GitHub Code Scanning
      if: always()
      uses: github/codeql-action/upload-sarif@b1722c1245f90604c2c348f9d1624af97ea8fc6e
      with:
        sarif_file: security-results.sarif
        category: security
