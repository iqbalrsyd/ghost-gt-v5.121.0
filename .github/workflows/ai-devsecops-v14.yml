  cms-markdown-render-xss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: scan-unsafe-html-injection-sites
        run: |
          # Set up output capture for the annotation-to-SARIF step.
          exec > >(tee -a cms-markdown-render-xss.shell_log) 2>&1
          # Run the original script in a subshell with set +e so
          # that any single command failure does not abort the
          # script before it can emit a '::error' annotation.
          inner_exit=0
          ( set +e
          PATTERN='dangerouslySetInnerHTML\s*=|v-html\s*=|\{\{\{html\b|\{\{html-safe\b'
          HITS=$(grep -rEn --include='*.js' --include='*.ts' --include='*.jsx' --include='*.tsx' --include='*.hbs' --include='*.handlebars' "$PATTERN" . 2>/dev/null | grep -vE '(node_modules|/dist/|/build/)' | head -200 || true)
          if [ -z "$HITS" ]; then
            echo "OK: no dangerouslySetInnerHTML / v-html / {{{html}}} call sites detected."
            exit 0
          fi
          echo "FOUND unescaped HTML injection sites — review sanitization:"
          printf '%s\n' "$HITS"
          # Heuristic: if any of the files are test fixtures, ignore; otherwise flag.
          # We simply exit 1 so the job reports failure for human review.
          exit 1
          ) || inner_exit=$?
          # If the inner script exited non-zero and emitted no
          # '::error'/'::warning' annotation, synthesise one so the
          # SARIF conversion step still has a finding to record.
          if [ "$inner_exit" -ne 0 ] && ! grep -qE '^::(error|warning)' cms-markdown-render-xss.shell_log; then
            echo "::error file=scan-unsafe-html-injection-sites::shell check failed (exit code $inner_exit) — see run log for details"
          fi
          exit $inner_exit

      - name: semgrep-cms-xss-html-injection
        run: |
          echo 'AI-designed Semgrep rule (id=ai-rule):'
          echo 'Rule body:'
          cat <<'SEMGREP_EOF' | sed 's/^/  /'

          SEMGREP_EOF
      - name: Convert cms-markdown-render-xss shell_check annotations to SARIF
        if: always()
        run: |
          cat > cms-markdown-render-xss_annotations_to_sarif.py <<'PY_EOF'
          import os, re, json
          log_path = 'cms-markdown-render-xss.shell_log'
          sarif_path = 'cms-markdown-render-xss-results.sarif'
          tool_name = 'cms-markdown-render-xss'
          tool_version = '1.0.0'
          information_uri = 'https://github.com/iqbalrsyd/ai-devsecops'
          rule_id_prefix = 'ai-devsecops-cms-markdown-render-xss'
          results = []
          if os.path.exists(log_path):
              pat = re.compile(
                  r'^::(error|warning)(?:\s+([A-Za-z]+=[^,]+(?:,[A-Za-z]+=[^,]+)*))?::(.*)$'
              )
              for idx, line in enumerate(open(log_path, encoding='utf-8', errors='replace')):
                  m = pat.match(line.rstrip('\n'))
                  if not m:
                      continue
                  level, props, msg = m.groups()
                  path = None
                  sl = None
                  el = None
                  title = None
                  if props:
                      for kv in props.split(','):
                          if '=' in kv:
                              k, v = kv.split('=', 1)
                              k = k.strip()
                              v = v.strip()
                              if k == 'file':
                                  path = v
                              elif k == 'line':
                                  try:
                                      sl = int(v)
                                  except ValueError:
                                      pass
                              elif k in ('endLine', 'col'):
                                  try:
                                      el = int(v) if k == 'endLine' else sl
                                  except ValueError:
                                      pass
                              elif k == 'title':
                                  title = v
                  if sl is None:
                      sl = 1
                  if el is None:
                      el = sl
                  sarif_level = 'error' if level == 'error' else 'warning'
                  msg = (msg or '').strip()
                  # If there is no file but there is a title, use the
                  if not msg and title:
                      msg = title
                  # Use the first 50 chars of the title (if any) as
                  slug_src = title or msg or 'finding'
                  slug = re.sub(r'[^a-z0-9]+', '-', slug_src.lower())[:50].strip('-')
                  rule_id = f'{rule_id_prefix}-{slug}-{sl}-{idx}'
                  results.append({
                      'ruleId': rule_id,
                      'level': sarif_level,
                      'message': {'text': msg or '(no message)'},
                      'locations': [{
                          'physicalLocation': {
                              'artifactLocation': {'uri': path or 'unknown'},
                              'region': {'startLine': sl, 'endLine': el},
                          },
                      }],
                  })
          existing = {}
          if os.path.exists(sarif_path) and os.path.getsize(sarif_path) > 0:
              try:
                  existing = json.load(open(sarif_path, encoding='utf-8'))
              except Exception:
                  existing = {}
          if not existing or 'runs' not in existing or not existing['runs']:
              existing = {
                  'version': '2.1.0',
                  '$schema': 'https://json.schemastore.org/sarif-2.1.0.json',
                  'runs': [{
                      'tool': {'driver': {
                          'name': tool_name, 'version': tool_version, 'informationUri': information_uri,
                      }},
                      'results': [],
                  }],
              }
          existing['runs'][0]['tool']['driver']['name'] = tool_name
          existing['runs'][0]['tool']['driver']['version'] = tool_version
          existing['runs'][0]['tool']['driver']['informationUri'] = information_uri
          existing['runs'][0]['results'] = (existing['runs'][0].get('results') or []) + results
          with open(sarif_path, 'w', encoding='utf-8') as f:
              json.dump(existing, f, indent=2)
          print(f'Wrote {len(results)} SARIF result(s) to {sarif_path}')
          PY_EOF
          python3 cms-markdown-render-xss_annotations_to_sarif.py
      - name: Ensure cms-markdown-render-xss-results.sarif exists (fallback for 0 findings)
        if: always()
        run: |
          if [ ! -s cms-markdown-render-xss-results.sarif ]; then
